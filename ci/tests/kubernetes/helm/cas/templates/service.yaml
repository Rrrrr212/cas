apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cas.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "cas.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.hazelcast.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cas.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: hazelcast
      port: {{ .Values.hazelcast.port }}
      targetPort: hazelcast
      protocol: TCP
  selector:
    {{- include "cas.selectorLabels" . | nindent 4 }}