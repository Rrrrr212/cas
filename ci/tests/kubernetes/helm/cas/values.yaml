replicaCount: 3

image:
  repository: registry.example.com/apereo/cas
  tag: "7.3.7"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "cas-app"

rbac:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/cas/actuator/prometheus"

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  ports:
    http: 8080
    https: 8443
    hazelcast: 5701

hazelcast:
  serviceName: "cas-hazelcast"
  port: 5701
  instanceName: "cas-hz"

redis:
  sentinel:
    enabled: true
    master: "mymaster"
    nodes:
      - "redis-sentinel-0.redis-sentinel:26379"
      - "redis-sentinel-1.redis-sentinel:26379"
      - "redis-sentinel-2.redis-sentinel:26379"
    password: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cas.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

cas:
  config:
    server:
      prefix: https://cas.example.com/cas
      name: https://cas.example.com
    adminPagesSecurity:
      ip: 127\\.0\\.0\\.1
    tgc:
      secure: true
      sameSitePolicy: "Lax"
    webflow:
      session:
        lock:
          tgt: false
    ticket:
      registry:
        hazelcast:
          cluster:
            core:
              instanceName: "cas-hz"
            discovery:
              enabled: true
            network:
              tcpip:
                members:
                  - "cas-hazelcast"

redisSentinel:
  enabled: true
  image:
    repository: redis
    tag: "8.8.0"
  replicas: 3
  masterSet: "mymaster"
  quorum: 2
  masterHost: "redis-master"
  masterPort: 6379
  serviceName: "redis-sentinel"