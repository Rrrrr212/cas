apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas-ha-observability.fullname" . }}
  labels:
    {{- include "cas-ha-observability.labels" . | nindent 4 }}
    {{- include "cas-ha-observability.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cas-ha-observability.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas-ha-observability.fullname" . }}-hazelcast-headless
  labels:
    {{- include "cas-ha-observability.labels" . | nindent 4 }}
    {{- include "cas-ha-observability.selectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "cas-ha-observability.selectorLabels" . | nindent 4 }}
  ports:
    - name: hazelcast
      port: {{ .Values.service.hazelcastPort }}
      targetPort: hazelcast
      protocol: TCP
