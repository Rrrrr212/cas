{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cas-ha-observability.fullname" . }}
  labels:
    {{- include "cas-ha-observability.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cas-ha-observability.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: https
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
{{- end }}
