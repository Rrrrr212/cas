{{- if and .Values.prometheusRule.enabled (eq .Values.ticketRegistry.type "hazelcast") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cas-ha-observability.fullname" . }}
  labels:
    {{- include "cas-ha-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: cas-ha-observability
      rules:
        - alert: CasHazelcastClusterQuorumLost
          expr: max(hazelcast_cluster_members) < {{ .Values.prometheusRule.hazelcastClusterMembersThreshold }}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Hazelcast cluster member count is below quorum
            description: Hazelcast cluster membership dropped below {{ .Values.prometheusRule.hazelcastClusterMembersThreshold }} for release {{ .Release.Name }}.
{{- end }}
