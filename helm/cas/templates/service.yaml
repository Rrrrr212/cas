apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas.fullname" . }}
  labels:
    {{- include "cas.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.cas.serverPort }}
      targetPort: https
      protocol: TCP
    - name: http
      port: {{ .Values.cas.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.hazelcast.enabled }}
    - name: hazelcast
      port: {{ .Values.hazelcast.port }}
      targetPort: hazelcast
      protocol: TCP
    {{- end }}
  selector:
    {{- include "cas.selectorLabels" . | nindent 4 }}
