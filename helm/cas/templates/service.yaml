apiVersion: v1
kind: Service
metadata:
  name: {{ include "cas.fullname" . }}
  labels:
    app: {{ include "cas.fullname" . }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 5701
      targetPort: hazelcast
      protocol: TCP
      name: hazelcast
  selector:
    app: {{ include "cas.fullname" . }}
