replicaCount: 3

image:
  repository: registry.example.com/apereo/cas
  tag: "7.3.7"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: registry-creds

cas:
  serverPort: 8443
  httpPort: 8080
  contextPath: /cas
  javaOpts: "-Xms512m -Xmx2048m"

hazelcast:
  enabled: true
  port: 5701
  tcpIpEnabled: true
  members: ""
  cluster:
    instanceName: cas-hazelcast
    backupCount: 2
    asyncBackupCount: 0
    evictionPolicy: LRU
    maxSizePolicy: USED_HEAP_PERCENTAGE
    maxSize: 85
    enableJet: false

redis:
  enabled: true
  sentinel:
    master: mymaster
    hosts: "redis-sentinel:26379"
    password: ""
  database: 0
  password: ""
  timeout: 2000
  connectTimeout: 2000
  pool:
    maxActive: 20
    maxIdle: 10
    minIdle: 5

service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

livenessProbe:
  httpGet:
    path: /cas/actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /cas/actuator/health/readiness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cas
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
